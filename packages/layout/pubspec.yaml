name: node_layout
version: 1.0.0
description: Layout engine plugin for Node Graph Notebook.
publish_to: none
environment:
  sdk: '>=3.8.0 <4.0.0'
resolution: workspace
dependencies:
  flutter: { sdk: flutter }
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  vector_math: ^2.2.0
  core: { path: ../core }
  appframe: { path: ../appframe }
  node_graph: { path: ../graph }
  provider: any
  core_data: any
  plugin: any
dev_dependencies:
  flutter_test: { sdk: flutter }

name: appframe
version: 0.1.0
description: >-
  Flutter shell for the node graph notebook rewrite: store implementations
  (file layer / sidecar / FSTGraph / UIStateStore) and, later, the render
  context, drag controller and flight shell.
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  core:
    path: ../core
  core_data:
    path: ../core_data
  flutter:
    sdk: flutter
  plugon:
    path: ../plugon
  # P1-1：设置持久化（theme/i18n——app 层注入 prefs）。
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

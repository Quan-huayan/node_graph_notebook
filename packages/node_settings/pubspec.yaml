name: node_settings
version: 0.1.0
description: >-
  Settings plugin (M7): SettingsService (theme mode persistence — MVP
  in-memory, app assembles persistence) + settings dialog (light/dark switch).
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  appframe:
    path: ../appframe
  core:
    path: ../core
  core_data:
    path: ../core_data
  flutter:
    sdk: flutter
  plugon:
    path: ../plugon

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # P2-5：仅测试用（theme_contract_test 持久化回读断言）。
  shared_preferences: ^2.3.0

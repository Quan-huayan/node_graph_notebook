name: node_i18n
version: 0.1.0
description: >-
  i18n plugin (M7): language settings entry (kind 'settings-i18n') + runtime
  language switching form (zh / English applies immediately, edits the
  shell-layer I18nService). The service itself lives in appframe and is
  globally reachable across plugins.
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  appframe:
    path: ../appframe
  core:
    path: ../core
  core_data:
    path: ../core_data
  flutter:
    sdk: flutter
  plugon:
    path: ../plugon

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

name: node_graph
version: 0.1.0
description: >-
  Graph plugin (M6 试金石): canvas container Concept with UIMove drop
  semantics (判据②), positioned node rendering, camera state, and the
  graph-nodes visibility dialog.
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  appframe:
    path: ../appframe
  core:
    path: ../core
  core_data:
    path: ../core_data
  flutter:
    sdk: flutter
  plugon:
    path: ../plugon

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

name: app
version: 0.1.0
description: >-
  Node Graph Notebook application entry: assembles HostRuntime with the
  builtin plugins and provides the Flutter UI shell.
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  appframe:
    path: ../appframe
  core:
    path: ../core
  core_data:
    path: ../core_data
  flutter:
    sdk: flutter
  node_ai:
    path: ../node_ai
  node_converter:
    path: ../node_converter
  node_data_recovery:
    path: ../node_data_recovery
  node_editor:
    path: ../node_editor
  node_folder:
    path: ../node_folder
  node_i18n:
    path: ../node_i18n
  node_market:
    path: ../node_market
  node_search:
    path: ../node_search
  node_settings:
    path: ../node_settings
  node_graph:
    path: ../node_graph
  node_lua:
    path: ../node_lua
  plugon:
    path: ../plugon
  # P2-2：main.dart 注入 SharedPreferences（P1-1 设置持久化由 app 层提供）。
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

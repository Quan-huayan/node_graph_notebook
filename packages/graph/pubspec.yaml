name: node_graph
version: 1.0.0
description: Core graph plugin for Node Graph Notebook with Flame rendering.
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'

resolution: workspace

dependencies:
  core_data:
    path: ../core_data
  plugin:
    path: ../plugin
  flutter:
    sdk: flutter
  flame: ^1.10.0
  vector_math: ^2.2.0
  provider: ^6.1.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  uuid: ^4.2.1
  path: ^1.8.3
  core:
    path: ../core
  appframe:
    path: ../appframe

  shared_preferences: any
  file_picker: any
  
  node_layout: any
  node_editor: any
  node_converter: any
dev_dependencies:
  flutter_test:
    sdk: flutter

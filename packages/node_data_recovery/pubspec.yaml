name: node_data_recovery
version: 0.1.0
description: >-
  Data recovery plugin (M7): backup / verify / repair commands (DTO + Handler,
  03 §四) — backup copies the sidecar store to data/backups/<timestamp>;
  verify checks sidecar parseability + reference integrity; repair drops
  corrupt sidecars (architecture §8 CorruptNodeError recovery path).
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  appframe:
    path: ../appframe
  core:
    path: ../core
  core_data:
    path: ../core_data
  flutter:
    sdk: flutter
  plugon:
    path: ../plugon

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

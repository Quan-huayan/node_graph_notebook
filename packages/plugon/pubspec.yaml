name: plugon
version: 2.0.0
description: >-
  A dependency-management infrastructure for Flutter applications built around
  plugin lifecycle, .NET-style DI, and typed extension points. Pure-Dart core
  with optional Flutter adapters (Provider / Bloc integration).
publish_to: none
resolution: workspace
environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

name: node_lua
version: 1.0.0
description: Lua scripting engine plugin for Node Graph Notebook.
publish_to: none
environment:
  sdk: '>=3.8.0 <4.0.0'
resolution: workspace
dependencies:
  flutter: { sdk: flutter }
  flutter_bloc: ^9.1.1
  provider: ^6.1.1
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  flutter_embed_lua: ^0.0.1
  ffi: ^2.0.0
  path: ^1.8.3
  core: { path: ../core }
  appframe: { path: ../appframe }
  node_graph: { path: ../graph }
  uuid: any
  core_data: any
  plugin: any
dev_dependencies:
  flutter_test: { sdk: flutter }
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

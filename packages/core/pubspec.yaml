name: core
version: 0.1.0
description: >-
  Core mechanisms for the node graph notebook rewrite: Concept matching
  priority, fallback Concept, acyclic check, nodeId→hookId invalidation,
  command routing. Pure Dart (no Flutter imports).
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  core_data:
    path: ../core_data
  # DI / ExtensionRegistry / PluginManager / Plugin 契约 → package:plugon
  # （architecture.md §2；M5 接入编排，M1 先声明依赖）
  plugon:
    path: ../plugon

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

name: node_search
version: 1.0.0
description: Search plugin for Node Graph Notebook.
publish_to: none
environment:
  sdk: '>=3.8.0 <4.0.0'
resolution: workspace
dependencies:
  flutter: { sdk: flutter }
  plugin:
    path: ../plugin
  flutter_bloc: ^9.1.1
  provider: ^6.1.1
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  core: { path: ../core }
  appframe: { path: ../appframe }
  node_graph: { path: ../graph }
  uuid: any
  shared_preferences: any
  core_data: any
dev_dependencies:
  flutter_test: { sdk: flutter }
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

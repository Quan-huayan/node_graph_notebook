name: node_graph_notebook
description: A concept-map based notebook application with node graph visualization, Markdown support, AI integration, and plugin system.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

workspace:
  - packages/plugin
  - packages/core_data
  - packages/core
  - packages/repository_fs
  - packages/app
  - packages/appframe
  - packages/data_recovery
  - packages/settings
  - packages/i18n_en
  - packages/i18n_zh
  - packages/market
  - packages/graph
  - packages/layout
  - packages/editor
  - packages/ai
  - packages/converter
  - packages/folder
  - packages/search

dependencies:
  core:
    path: packages/core
  core_data:
    path: packages/core_data
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2

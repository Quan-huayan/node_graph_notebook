name: node_graph_notebook
description: A concept-map based notebook application with node graph visualization, Markdown support, AI integration, and plugin system.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

workspace:
  - packages/plugon
  - packages/core_data
  - packages/core
  - packages/appframe
  - packages/node_folder
  - packages/node_graph
  - packages/node_ai
  - packages/node_lua
  - packages/node_editor
  - packages/node_converter
  - packages/node_search
  - packages/node_i18n
  - packages/node_settings
  - packages/node_market
  - packages/node_data_recovery
  - packages/app

# 旧 19 包已冻结归档到 archive/（01 拍板记录 #4，M6 后整体删除）。
# 新架构包（core_data / core / appframe / plugins/*）在 M1-M5 里程碑逐个建入此列表。

# 仅根级工具脚本（tool/benchmark.dart）使用；非应用入口。
dev_dependencies:
  appframe:
    path: packages/appframe
